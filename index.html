<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0306">
<title>JARVIS — Iron Man Trading Assistant</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="apple-touch-icon" href="./apple-touch-icon.svg">
<link rel="mask-icon" href="./favicon.svg" color="#ff5252">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg-0: #050304;
  --bg-1: #0d0708;
  --bg-2: #15090a;
  --bg-glass: rgba(15, 9, 7, 0.75);
  --orange: #ff7a3d;
  --orange-2: #ffa05c;
  --gold: #ffc977;
  --pink: #ff5577;
  --green: #5dffa0;
  --red: #ff7070;
  --text: #fff5e8;
  --text-dim: #d4a580;
  --border: rgba(255, 122, 61, 0.22);
  --border-strong: rgba(255, 122, 61, 0.5);
}

html, body {
  height: 100%;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;
  font-feature-settings: 'cv11', 'ss01';
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
body {
  background: var(--bg-0);
  color: var(--text);
  padding: max(env(safe-area-inset-top), 12px) 12px max(env(safe-area-inset-bottom), 12px);
  min-height: 100vh;
  background-image:
    radial-gradient(ellipse at 0% 0%, rgba(255, 122, 61, 0.10) 0%, transparent 60%),
    radial-gradient(ellipse at 100% 0%, rgba(255, 85, 119, 0.06) 0%, transparent 55%),
    radial-gradient(ellipse at 50% 100%, rgba(255, 201, 119, 0.04) 0%, transparent 65%);
  background-attachment: fixed;
  overflow-x: hidden;
}

.container { max-width: 1400px; margin: 0 auto; }

/* ━━━ Header ━━━ */
header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px; padding: 14px 18px;
  background: linear-gradient(135deg, rgba(255, 107, 53, 0.95) 0%, rgba(255, 77, 109, 0.85) 100%);
  border-radius: 18px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow:
    0 8px 32px rgba(255, 107, 53, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.2);
  position: sticky; top: max(env(safe-area-inset-top), 8px); z-index: 100;
}
header h1 {
  font-size: clamp(18px, 4vw, 24px);
  font-weight: 800; color: #fff;
  letter-spacing: 1.5px;
  display: flex; align-items: center; gap: 10px;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
  font-family: 'Inter', sans-serif;
}
.iron-icon {
  width: 64px; height: 64px;
  display: inline-block;
  filter:
    drop-shadow(0 6px 20px rgba(0, 188, 212, 0.5))
    drop-shadow(0 2px 12px rgba(198, 40, 40, 0.6));
  animation: float 3.5s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-5px) scale(1.04); }
}
@media (max-width: 768px) {
  .iron-icon { width: 52px; height: 52px; }
}
@media (max-width: 480px) {
  .iron-icon { width: 44px; height: 44px; }
}
.header-actions { display: flex; gap: 8px; }
.btn {
  background: rgba(255, 255, 255, 0.18);
  color: #fff; border: 1px solid rgba(255, 255, 255, 0.25);
  padding: 10px 16px; border-radius: 12px;
  cursor: pointer; font-size: 13px; font-weight: 600;
  font-family: inherit;
  min-height: 44px;  /* iOS 가이드라인 */
  display: inline-flex; align-items: center; gap: 6px;
  backdrop-filter: blur(10px);
  transition: all 0.2s ease;
}
.btn:hover { background: rgba(255, 255, 255, 0.28); transform: translateY(-1px); }
.btn:active { transform: scale(0.96); }
.btn.voice.active {
  background: #ff4500;
  animation: pulse 1.5s ease-in-out infinite;
  border-color: #fff;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255, 69, 0, 0.7); }
  50% { box-shadow: 0 0 0 14px rgba(255, 69, 0, 0); }
}

/* ━━━ Summary Cards (Glass Effect) ━━━ */
.summary {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}
.card {
  background: var(--bg-glass);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow:
    0 4px 24px rgba(0, 0, 0, 0.3),
    inset 0 1px 0 rgba(255, 255, 255, 0.05);
  position: relative;
  overflow: hidden;
  transition: all 0.3s ease;
}
.card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--orange), var(--orange-2));
}
.card.hero {
  background: linear-gradient(135deg, rgba(255, 107, 53, 0.15), rgba(255, 77, 109, 0.1));
  border: 1px solid rgba(255, 107, 53, 0.35);
  grid-column: span 1;
}
.card.hero::before {
  height: 3px;
  background: linear-gradient(90deg, var(--orange), var(--gold));
}
.card-label {
  font-size: 10px; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 1px; font-weight: 600;
}
.card-value {
  font-size: 22px; font-weight: 800;
  margin-top: 6px; color: var(--text);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  letter-spacing: -0.5px;
}
.card.hero .card-value { font-size: 26px; }
.timestamp {
  font-size: 11px; color: var(--text-dim); margin-top: 4px;
  font-family: 'JetBrains Mono', monospace;
}

.green { color: var(--green); } .red { color: var(--red); } .gray { color: var(--text-dim); }
.orange { color: var(--orange-2); } .gold { color: var(--gold); }

/* ━━━ Sections ━━━ */
.section {
  background: var(--bg-glass);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 16px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
}
.section h2 {
  font-size: 15px; font-weight: 700;
  margin-bottom: 14px; padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
  color: var(--gold);
  display: flex; align-items: center; gap: 6px;
}

/* ━━━ Tables ━━━ */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -16px; padding: 0 16px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 720px; }
thead { background: rgba(255, 107, 53, 0.08); }
th, td { padding: 10px 8px; text-align: left; white-space: nowrap; }
th {
  font-weight: 600; color: var(--orange-2);
  text-transform: uppercase; font-size: 10px;
  letter-spacing: 0.8px; padding: 12px 8px;
}
tbody tr {
  border-top: 1px solid rgba(255, 140, 66, 0.08);
  transition: background 0.15s;
}
tbody tr:hover { background: rgba(255, 107, 53, 0.05); }
.long { color: var(--green); font-weight: 700; }
.short { color: var(--red); font-weight: 700; }
td.mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; }
.symbol-tag {
  display: inline-block;
  padding: 3px 8px;
  background: rgba(255, 107, 53, 0.15);
  border: 1px solid rgba(255, 107, 53, 0.3);
  border-radius: 6px;
  font-weight: 700;
  font-size: 12px;
}

/* ━━━ Bots ━━━ */
.bot-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 8px;
}
.bot {
  padding: 10px 14px;
  background: rgba(255, 107, 53, 0.06);
  border: 1px solid rgba(255, 107, 53, 0.2);
  border-radius: 10px;
  font-size: 12px;
  border-left: 3px solid var(--orange-2);
  font-family: 'JetBrains Mono', monospace;
  transition: all 0.2s;
}
.bot:hover { background: rgba(255, 107, 53, 0.12); transform: translateY(-1px); }
.bot .pid { color: var(--text-dim); font-size: 11px; margin-top: 2px; }

/* ━━━ Voice ━━━ */
#voiceLog {
  margin-top: 12px; padding: 12px;
  background: rgba(0, 0, 0, 0.25);
  border-radius: 10px;
  font-size: 13px;
  min-height: 50px;
  border: 1px solid var(--border);
  font-family: 'JetBrains Mono', monospace;
  max-height: 200px;
  overflow-y: auto;
}
.voice-msg { padding: 4px 0; }
.voice-msg .you { color: var(--orange-2); font-weight: 700; }
.voice-msg .bot { color: var(--green); }
.voice-hint {
  font-size: 12px; color: var(--text-dim); margin-bottom: 8px;
  background: rgba(255, 183, 77, 0.06);
  padding: 8px 12px;
  border-radius: 8px;
  border-left: 2px solid var(--gold);
}

/* ━━━ 반응형 ━━━ */
@media (max-width: 1024px) {
  .summary { grid-template-columns: repeat(3, 1fr) !important; }
}
@media (max-width: 768px) {
  body { padding: max(env(safe-area-inset-top), 8px) 10px max(env(safe-area-inset-bottom), 10px); }
  header { padding: 12px 14px; border-radius: 14px; }
  header h1 { font-size: 17px; }
  .btn { padding: 8px 12px; font-size: 12px; min-height: 42px; }
  .summary { grid-template-columns: repeat(2, 1fr) !important; gap: 10px; }
  .card { padding: 14px; border-radius: 14px; }
  .card-value { font-size: 18px !important; }
  .card.hero { grid-column: span 2; }
  .card.hero .card-value { font-size: 22px !important; }
  .section { padding: 14px; border-radius: 14px; }
  .section h2 { font-size: 14px; }
  table { font-size: 12px; }
  th, td { padding: 8px 6px; }
  .bot-list { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
}
@media (max-width: 480px) {
  .summary { grid-template-columns: 1fr !important; }
  .card.hero { grid-column: 1; }
  header h1::before { display: none; }
  /* PnL/수익률 카드 강조 */
  .pnl-priority, .return-priority {
    border-top: 3px solid var(--gold) !important;
    background: linear-gradient(135deg, rgba(255, 122, 61, 0.12), rgba(255, 201, 119, 0.06)) !important;
  }
  .pnl-priority .card-value, .return-priority .card-value { font-size: 26px !important; }
}
</style>
</head>
<body>
<div class="container">

<header>
  <h1>
    <svg class="iron-icon" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="goldHL" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="#fff4c2"/>

        </linearGradient>
        <linearGradient id="goldShine" x1="0" x2="1" y1="0" y2="0">

        </linearGradient>
        <linearGradient id="redBase" x1="0" x2="0" y1="0" y2="1">

          <stop offset="100%" stop-color="#006978" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="arcReactor" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffffff"/>

          <stop offset="70%" stop-color="#00bcd4"/>
          <stop offset="100%" stop-color="#005566"/>
        </radialGradient>

          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>

      <!-- Red outer helmet (얼굴만, 어깨 제거) -->
      <path fill="url(#redBase)" stroke="#2a0000" stroke-width="1.8"
        d="M30 50 L22 110 Q28 165 100 188 Q172 165 178 110 L170 50 L158 75 L158 150 Q140 172 100 178 Q60 172 42 150 L42 75 Z"/>

      <!-- Gold faceplate (정면 얼굴) -->
      <path fill="url(#goldHL)" stroke="#3a2400" stroke-width="1.8"
        d="M50 42 L100 26 L150 42 L155 88 L148 128 L138 150 Q120 165 100 168 Q80 165 62 150 L52 128 L45 88 Z"/>

      <!-- Gold shine highlight -->
      <path fill="url(#goldShine)" opacity="0.5"
        d="M55 50 L100 36 L145 50 L142 85 L130 75 L115 55 L100 50 L85 55 L70 75 L58 85 Z"/>

      <!-- Faceplate panel lines -->
      <path fill="none" stroke="#5e3a00" stroke-width="0.8" opacity="0.6"
        d="M62 84 Q100 72 138 84 M62 96 Q100 91 138 96 M70 118 Q100 128 130 118"/>

      <!-- Eye slots -->
      <path fill="#000" stroke="#3d2400" stroke-width="0.8"
        d="M58 76 Q70 68 92 74 L94 92 Q78 96 60 91 Z"/>
      <path fill="#000" stroke="#3d2400" stroke-width="0.8"
        d="M142 76 Q130 68 108 74 L106 92 Q122 96 140 91 Z"/>

      <!-- Eye glow -->
      <ellipse cx="76" cy="84" rx="14" ry="5" fill="url(#eyeGlow)" filter="url(#glow1)"/>
      <ellipse cx="124" cy="84" rx="14" ry="5" fill="url(#eyeGlow)" filter="url(#glow1)"/>
      <ellipse cx="76" cy="84" rx="10" ry="2.2" fill="#fff"/>
      <ellipse cx="124" cy="84" rx="10" ry="2.2" fill="#fff"/>

      <!-- Eyebrow shadow -->
      <path fill="#000" opacity="0.3" d="M55 70 L96 64 L94 76 L57 80 Z"/>
      <path fill="#000" opacity="0.3" d="M145 70 L104 64 L106 76 L143 80 Z"/>

      <!-- Nose ridge -->
      <path fill="#000" opacity="0.25" d="M96 86 L100 116 L104 86 L102 112 L98 112 Z"/>

      <!-- Mouth grille -->
      <rect x="74" y="124" width="52" height="2.5" rx="1.2" fill="#0a0a0a"/>
      <rect x="76" y="130" width="48" height="2.5" rx="1.2" fill="#0a0a0a"/>
      <rect x="78" y="136" width="44" height="2.5" rx="1.2" fill="#0a0a0a"/>
      <rect x="82" y="142" width="36" height="2.5" rx="1.2" fill="#0a0a0a"/>

      <!-- Helmet highlights -->
      <path fill="#ffffff" opacity="0.25" d="M40 58 L48 53 L46 75 L38 80 Z"/>

    </svg>
    <span style="display:flex;flex-direction:column;line-height:1">
      <span style="background:linear-gradient(135deg,#fff4c2 0%,#ffd54f 50%,#d99500 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:900">JARVIS</span>
      <span style="font-size:10px;letter-spacing:3px;opacity:0.85;font-weight:600;color:#80efff">TRADING ASSISTANT</span>
    </span>
  </h1>
  <div class="header-actions">
    <button class="btn voice" id="voiceBtn">🎤</button>
    <button class="btn" id="refreshBtn">🔄</button>
  </div>
</header>

<!-- 통합 자산 요약 (모바일에서 PnL/수익률 우선 노출) -->
<div class="summary">
  <!-- 1. 미실현 PnL (모바일 1번째) -->
  <div class="card pnl-priority">
    <div class="card-label">💹 미실현 PnL</div>
    <div class="card-value" id="totalPnl">-</div>
    <div class="timestamp" id="updateTs">-</div>
  </div>
  <!-- 2. 수익률 (모바일 2번째) -->
  <div class="card return-priority" style="cursor:pointer" onclick="setInvest()">
    <div class="card-label">📈 수익률 <span style="opacity:0.5">✏️</span></div>
    <div class="card-value" id="returnPct">-</div>
    <div class="timestamp" id="profitKRW">-</div>
  </div>
  <!-- 3. 총 자산 -->
  <div class="card hero">
    <div class="card-label">💰 총 자산</div>
    <div class="card-value" id="grandTotal">-</div>
    <div class="timestamp" id="grandTotalUSD">-</div>
  </div>
  <!-- 4. 바이낸스 -->
  <div class="card">
    <div class="card-label">바이낸스</div>
    <div class="card-value" id="bnTotal">-</div>
    <div class="timestamp" id="bnSplit">-</div>
  </div>
  <!-- 5. 업비트 -->
  <div class="card">
    <div class="card-label">업비트</div>
    <div class="card-value" id="upTotal">-</div>
    <div class="timestamp" id="upSplit">-</div>
  </div>
</div>

<!-- 바이낸스 -->
<div class="section">
  <h2>📊 바이낸스 Futures</h2>
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>심볼</th><th>방향</th><th>레버</th><th>진입가</th><th>현재가</th>
        <th>수량</th><th>명목</th><th>마진</th><th>PnL%</th><th>PnL($)</th>
        <th>SL ↓</th><th>TP1 / TP2 / TP3</th>
      </tr></thead>
      <tbody id="bnTable"><tr><td colspan="12" style="text-align:center;color:var(--text-dim);padding:24px">로딩...</td></tr></tbody>
    </table>
  </div>
</div>

<!-- 업비트 -->
<div class="section">
  <h2>📊 업비트</h2>
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>코인</th><th>보유</th><th>평균매입</th><th>현재가</th>
        <th>투자금</th><th>평가금</th><th>PnL%</th><th>PnL(₩)</th>
      </tr></thead>

</div>

  <div id="voiceLog">🎤 버튼을 눌러 음성 명령을 시작하세요.</div>

<script>
// MSA — Frontend (GitHub Pages) ↔ Backend API
const params = new URLSearchParams(location.search);
const apiFromQuery = params.get('api');
if (apiFromQuery) localStorage.setItem('OPENCLAW_API', apiFromQuery);
const API_BASE = localStorage.getItem('OPENCLAW_API') || 'http://localhost:3000';
console.log('API_BASE:', API_BASE);

const fmt = {
  usd: (n) => '$' + (n||0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}),
  pct: (n) => (n>=0?'+':'') + (n||0).toFixed(2) + '%',
  krw: (n) => '₩' + Math.round(n||0).toLocaleString(),
  qty: (n) => Number(n||0).toLocaleString(undefined, {maximumFractionDigits: 4}),
};
const cls = (n) => n>0 ? 'green' : n<0 ? 'red' : 'gray';

// LocalTunnel 인증 페이지 우회 + Cloudflare 등 헤더
const fetchOpts = (extra) => ({
  headers: {
    'bypass-tunnel-reminder': 'true',
    'Content-Type': 'application/json',
    ...(extra || {})
  }
});

async function refresh() {
  try {
    const r = await fetch(API_BASE + '/api/status', fetchOpts()).then(r=>r.json());
    if (!r.ok) throw new Error(r.error);
    const { binance, upbit, bots, summary } = r;

    // 총 자산
    const grandTotal = summary.grandTotalKRW || 0;
    document.getElementById('grandTotal').textContent = fmt.krw(grandTotal);
    document.getElementById('grandTotalUSD').textContent = fmt.usd(grandTotal / (r.exchange?.USD_KRW || 1476));

    // 수익률 — localStorage(입금-출금) 우선
    const returnPctEl = document.getElementById('returnPct');
    const profitKRWEl = document.getElementById('profitKRW');
    const dep = parseFloat(localStorage.getItem('JARVIS_DEPOSIT') || '0');
    const wd  = parseFloat(localStorage.getItem('JARVIS_WITHDRAW') || '0');
    const manualInvest = dep > 0 ? (dep - wd) : parseFloat(localStorage.getItem('JARVIS_INVEST_KRW') || '0');
    let investKRW = manualInvest > 0 ? manualInvest : (summary.investKRW || 0);
    if (investKRW > 0) {
      const profit = grandTotal - investKRW;
      const rPct = (profit / investKRW) * 100;
      returnPctEl.textContent = fmt.pct(rPct);
      returnPctEl.className = 'card-value ' + cls(rPct);
      profitKRWEl.innerHTML = (profit>=0?'+':'') + fmt.krw(profit) +
        (dep > 0
          ? '<br><span style="opacity:0.6;font-size:10px">입금 ₩' + dep.toLocaleString() + ' - 출금 ₩' + wd.toLocaleString() + '</span>'
          : '<br><span style="opacity:0.6;font-size:10px">투자 ' + fmt.krw(investKRW) + '</span>');
    } else {
      returnPctEl.textContent = '클릭✏️';
      returnPctEl.className = 'card-value gold';
      profitKRWEl.textContent = '입금/출금 입력하기';
    }

    // 바이낸스
    document.getElementById('bnTotal').textContent = fmt.krw(binance.totalKRW || 0);
    document.getElementById('bnSplit').textContent = `선물 ${fmt.krw(binance.futuresKRW||0)}/현물 ${fmt.krw(binance.spotKRW||0)}`;

    // 업비트
    document.getElementById('upTotal').textContent = fmt.krw(upbit.totalKRW || 0);
    document.getElementById('upSplit').textContent = `KRW ${fmt.krw(upbit.krwBalance||0)}/코인 ${fmt.krw(upbit.coinValue||0)}`;

    // PnL
    const totalPnl = document.getElementById('totalPnl');
    totalPnl.textContent = fmt.usd(summary.netPnlUSD);
    totalPnl.className = 'card-value ' + cls(summary.netPnlUSD);
    document.getElementById('updateTs').textContent = '⏱ ' + new Date().toLocaleTimeString('ko-KR');

    // 바이낸스 테이블
    document.getElementById('bnTable').innerHTML = binance.positions.map(p => {
      const fixDigits = (v) => v.toFixed(v<1?6:3);
      const g = p.guard;
      const slCell = g ? `<span class="mono short">$${fixDigits(g.sl)}<br><span style="font-size:11px;opacity:0.7">${g.slPct}%</span></span>` : '-';
      const tpCell = g ? `<span class="mono long" style="font-size:12px">
        T1 $${fixDigits(g.tp1)} <span style="opacity:0.6">(+${g.tp1Pct}%)</span><br>
        T2 $${fixDigits(g.tp2)} <span style="opacity:0.6">(+${g.tp2Pct}%)</span><br>
        T3 $${fixDigits(g.tp3)} <span style="opacity:0.6">(+${g.tp3Pct}%)</span>
      </span>` : '-';
      return `
      <tr>
        <td><span class="symbol-tag">${p.symbol.replace('USDT','')}</span></td>
        <td class="${p.side==='LONG'?'long':'short'}">${p.side}</td>
        <td class="mono">${p.leverage}x</td>
        <td class="mono">$${fixDigits(p.entry)}</td>
        <td class="mono">$${fixDigits(p.mark)}</td>
        <td class="mono">${fmt.qty(p.qty)}</td>
        <td class="mono">$${p.notional.toFixed(0)}</td>
        <td class="mono gold">$${p.margin.toFixed(2)}</td>
        <td class="mono ${cls(p.pnlPct)}">${fmt.pct(p.pnlPct)}</td>
        <td class="mono ${cls(p.pnl)}">${fmt.usd(p.pnl)}</td>
        <td>${slCell}</td>
        <td>${tpCell}</td>
      </tr>`;
    }).join('') || `<tr><td colspan="12" style="text-align:center;color:var(--text-dim);padding:24px">활성 포지션 없음</td></tr>`;

    // 업비트 테이블
    document.getElementById('upTable').innerHTML = upbit.holdings.map(h => `
      <tr>
        <td><span class="symbol-tag">${h.currency}</span></td>
        <td class="mono">${fmt.qty(h.balance)}</td>
        <td class="mono">${fmt.krw(h.avgPrice)}</td>
        <td class="mono">${fmt.krw(h.currentPrice)}</td>
        <td class="mono">${fmt.krw(h.invest)}</td>
        <td class="mono">${fmt.krw(h.value)}</td>
        <td class="mono ${cls(h.pnlPct)}">${fmt.pct(h.pnlPct)}</td>
        <td class="mono ${cls(h.pnlKRW)}">${fmt.krw(h.pnlKRW)}</td>
      </tr>`).join('') || `<tr><td colspan="8" style="text-align:center;color:var(--text-dim);padding:24px">보유 없음</td></tr>`;

    // 봇
    document.getElementById('botList').innerHTML = bots.map(b => `
      <div class="bot">
        <div>${b.file.replace('src/openclaw/','').replace('src/upbit/','').replace('src/dashboard/','').replace('.ts','')}</div>
        <div class="pid">PID ${b.pid}</div>
      </div>`).join('') || '<div class="bot" style="border-left-color:var(--red)">가동 봇 없음</div>';
  } catch (e) {
    console.error('refresh error:', e);
    document.getElementById('updateTs').textContent = '❌ ' + e.message;
  }
}

document.getElementById('refreshBtn').onclick = refresh;
refresh();
setInterval(refresh, 5000);

// 음성 인식
const voiceBtn = document.getElementById('voiceBtn');
const voiceLog = document.getElementById('voiceLog');
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;

if (SR) {
  recognition = new SR();
  recognition.lang = 'ko-KR';
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onresult = async (e) => {
    const transcript = e.results[0][0].transcript;
    addVoiceLog('🎤 ' + transcript, 'you');
    try {
      const r = await fetch(API_BASE + '/api/voice', {
        method: 'POST',
        headers: {'Content-Type':'application/json', 'bypass-tunnel-reminder':'true'},
        body: JSON.stringify({ text: transcript })
      }).then(r=>r.json());
      addVoiceLog('🤖 ' + r.action.say, 'bot');
      if (['show_positions','show_balance','show_pnl','show_bots'].includes(r.intent)) refresh();
      if (window.speechSynthesis) {
        const u = new SpeechSynthesisUtterance(r.action.say);
        u.lang = 'ko-KR';
        speechSynthesis.speak(u);
      }
    } catch (err) {
      addVoiceLog('❌ ' + err.message, 'bot');
    }
  };
  recognition.onend = () => {
    voiceBtn.classList.remove('active');
    voiceBtn.textContent = '🎤';
  };
  recognition.onerror = (e) => {
    voiceBtn.classList.remove('active');
    voiceBtn.textContent = '🎤';
    addVoiceLog('❌ 인식 오류: ' + e.error, 'bot');
  };

  voiceBtn.onclick = () => {
    voiceBtn.classList.add('active');
    voiceBtn.textContent = '🔴';
    recognition.start();
  };
} else {
  voiceBtn.disabled = true;
  voiceBtn.textContent = '🎤❌';
  voiceBtn.title = 'Chrome 또는 Safari 권장';
}

// 입금/출금 별도 입력 → 순 투자금 계산
function setInvest() {
  const oldDep = parseFloat(localStorage.getItem('JARVIS_DEPOSIT') || '0');
  const oldWd  = parseFloat(localStorage.getItem('JARVIS_WITHDRAW') || '0');
  const depStr = prompt(`총 입금액 (₩)\n현재: ${oldDep.toLocaleString()}`, oldDep.toString());
  if (depStr === null) return;
  const wdStr = prompt(`총 출금액 (₩)\n현재: ${oldWd.toLocaleString()}`, oldWd.toString());
  if (wdStr === null) return;
  const dep = parseFloat(depStr.replace(/,/g, '')) || 0;
  const wd = parseFloat(wdStr.replace(/,/g, '')) || 0;
  const net = dep - wd;
  localStorage.setItem('JARVIS_DEPOSIT', String(dep));
  localStorage.setItem('JARVIS_WITHDRAW', String(wd));
  localStorage.setItem('JARVIS_INVEST_KRW', String(net));
  alert(`✅ 저장 완료\n입금: ₩${dep.toLocaleString()}\n출금: ₩${wd.toLocaleString()}\n순투자: ₩${net.toLocaleString()}`);
  refresh();
}

function addVoiceLog(msg, type) {
  const div = document.createElement('div');
  div.className = 'voice-msg';
  div.innerHTML = `<span class="${type}">${msg}</span>`;
  voiceLog.appendChild(div);
  voiceLog.scrollTop = voiceLog.scrollHeight;
}
</script>
